name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the run in flight irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows is where the app actually runs. macOS is here to prove the
    # platform split holds: it installs without winsdk, imports the package,
    # and runs every test that is not tied to a media session. Without it,
    # "cross-platform" would be a claim rather than a check.
    #
    # Both bill above the Linux rate on a private repository, so the job stays
    # to one install and two commands and cancels superseded runs.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Import the package
        # The cheapest possible proof that the platform split works: on macOS
        # this fails outright if anything imports winsdk at module scope.
        run: python -c "import lyrica, lyrica.sessions; print(lyrica.sessions.create_reader().__class__.__name__)"

      - name: Lint
        run: ruff check .

      - name: Test
        # The suite is offline by contract, so a slow or unreachable lyrics API
        # can never turn this red. Network behaviour lives in research/viability
        # and is run by hand.
        run: pytest -q
