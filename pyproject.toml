[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyrica"
version = "0.1.0"
description = "Real-time synced lyrics overlay (Spotify, YouTube, YT Music, SoundCloud)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "requests>=2.31",
    # Decoding and blurring the album art. tkinter reads neither JPEG nor a
    # blur, and the backdrop needs both.
    "pillow>=10",
    # Windows only: it has no wheels elsewhere, and installing it unconditionally
    # is what would stop the package installing on a Mac at all.
    "winsdk>=1.0.0b10; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    # Only for building the standalone executable; nothing imports it.
    "pyinstaller>=6",
]

# A GUI launcher, not a console one. `[project.scripts]` builds an executable
# that allocates a console, which for an always-on-top overlay means a black
# window sitting behind the lyrics for the entire session. Nothing is lost by
# dropping it: the app already writes to a log file precisely because it has
# nowhere else to write.
[project.gui-scripts]
lyrica = "lyrica.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Pinned explicitly rather than inherited, so upgrading ruff cannot silently
# change what the build enforces.
[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # import ordering
    "UP",     # pyupgrade
    "B",      # bugbear: likely bugs
    "BLE",    # blind except
    "S",      # bandit: security-adjacent smells
    "FURB",   # modernisation
    "RUF",    # ruff's own rules
]
ignore = [
    # Flags characters that could be homoglyph attacks. Here the en dash is
    # load-bearing: browsers really do publish "Artist – Title" with it, so the
    # separator list has to contain the character it is warning about.
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# Probes are throwaway scripts run by hand against live APIs. They print rather
# than return, and swallowing a provider's failure is the point: one dead source
# must not end the run before the others are measured. Imports come after the
# stdout reconfiguration because the console must be UTF-8 before anything can
# print a non-ASCII track title.
"research/viability/*" = ["BLE001", "S110", "T201", "E402", "E501"]
# Tests name fixtures at module scope and assert on them.
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
